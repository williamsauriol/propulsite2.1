name: Weekly Blog Auto-Publisher

on:
  schedule:
    # Every Monday at 9:00 AM Eastern (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new blog article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog.mjs

      - name: Commit and push new article
        run: |
          git config --global user.name "Propulsite Blog Bot"
          git config --global user.email "bot@propulsite.ca"
          git add src/constants/painPointsData.tsx src/pages/Blog.tsx
          git diff --staged --quiet || git commit -m "feat: auto-publish new weekly blog article [skip ci]"
          git push
