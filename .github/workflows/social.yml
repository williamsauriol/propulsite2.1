name: Publication Instagram hebdomadaire

# Le mercredi 13 h UTC (9 h, heure de l'Est). Pas le lundi : le bot de blogue
# tourne deja ce jour-la, et deux commits automatiques le meme matin rendent
# l'historique illisible quand quelque chose casse.
on:
  schedule:
    - cron: '0 13 * * 3'
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier sur Facebook (non = generer seulement)'
        required: false
        default: 'oui'
      instagram:
        description: 'Publier sur Instagram par le robot, SANS musique (oui / non)'
        required: false
        default: 'non'

jobs:
  social:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm ci

      # Puppeteer n'est PAS une dependance du site : il pese ~150 Mo avec son
      # Chrome, et Vercel l'installerait a chaque deploiement pour rien. On le
      # pose ici seulement, sans toucher package.json.
      - name: Installer Chrome pour le rendu de l'image
        run: npm install --no-save puppeteer@23

      # Trois cles, dans l'ordre d'importance.
      #
      # ANTHROPIC_API_KEY ecrit trois brouillons et choisit le meilleur (environ
      #   10 cents par semaine). Sans elle, ou sans credit, rien ne part.
      # PEXELS_API_KEY trouve de VRAIES photos de fond. Gratuite, et prioritaire
      #   sur l'image generee : le fil d'un entrepreneur est fait de photos.
      # GEMINI_API_KEY peint une matiere quand aucune vraie photo n'est
      #   disponible (~0,67 $ US pour les cinq diapos).
      #
      # Sans les deux dernieres, le gabarit reprend son fond plat et la
      # publication part quand meme.
      - name: Generer la publication de la semaine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/social-generer.ts

      # L'image doit etre POUSSEE avant l'appel a Meta : l'API d'Instagram va
      # chercher l'image elle-meme a une URL publique, elle n'accepte pas qu'on
      # lui envoie les octets. Le depot etant public, raw.githubusercontent la
      # sert des que le commit est en ligne.
      # `git status --porcelain`, PAS `git diff`. L'image de la semaine vient
      # d'etre creee : elle n'est suivie par personne, et `git diff` ne regarde
      # que les fichiers deja suivis. Il repondait donc « rien de nouveau » sur
      # une image bel et bien la, l'etape sortait en vert, et le robot jetait
      # son travail sans que rien n'ait l'air casse.
      - name: Pousser l'image
        run: |
          if [ -z "$(git status --porcelain public/social)" ]; then
            echo "Rien de nouveau — on s'arrete ici."
            exit 0
          fi
          git config user.name "Propulsite Social Bot"
          git config user.email "bot@propulsite.ca"
          git add public/social
          git commit -m "social: publication de la semaine [skip ci]"
          git pull --rebase --autostash
          git push

      # Depuis le 24 novembre 2026, William publie lui-meme sur Instagram, avec
      # une chanson : l'API n'accepte aucun son sur un carrousel. Il prend les
      # images sur propulsite.ca/social/publier.html. Cette etape ne sert que de
      # secours, lancee a la main. Attention : s'il a deja publie ce carrousel,
      # elle le publierait une deuxieme fois.
      - name: Publier sur Instagram (secours, sans musique)
        if: ${{ github.event.inputs.instagram == 'oui' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          # Facultatif : force le lieu au lieu de le chercher par son nom.
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
        run: npx tsx scripts/social-publier.ts

      # Le meme carrousel sur la Page Facebook. Jamais bloquant : tant que le
      # jeton n'a pas pages_manage_posts, le script le dit et on continue.
      # `!cancelled()` : il tourne meme si Instagram a echoue.
      - name: Publier sur Facebook
        if: ${{ !cancelled() && github.event.inputs.publier != 'non' }}
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: npx tsx scripts/social-facebook.ts

      # Ce que les publications ont donne : mentions j'aime, envois, sauvegardes.
      # Le generateur relit ces chiffres la semaine suivante. Jamais bloquant :
      # si Meta refuse la mesure, la publication reste faite et le journal part.
      - name: Mesurer les publications
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: npx tsx scripts/social-mesurer.ts

      # `!cancelled()` : on garde la trace de Facebook meme si Instagram a echoue.
      - name: Enregistrer la publication au journal
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain public/social/journal.json)" ]; then
            echo "Journal inchange."
            exit 0
          fi
          git config user.name "Propulsite Social Bot"
          git config user.email "bot@propulsite.ca"
          git add public/social/journal.json
          git commit -m "social: journal a jour [skip ci]"
          git pull --rebase --autostash
          git push
